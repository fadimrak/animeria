<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trend Animeler — ANIMERIA</title>
  <meta name="description" content="Şu anda en popüler ve trend olan anime serilerini keşfedin."/>
  
  <link rel="icon" type="image/png" href="assets/logo.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700;800;900&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="css/theme.css"/>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/player.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="brand-logo-wrap">
        <img src="assets/logo.png" alt="ANIMERIA" class="brand-svg-logo"/>
        <span style="font-family: var(--font-display); font-weight: 900; font-size: 1.35rem; letter-spacing: 0.08em; color: #ffffff;">ANIMERIA</span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="/" class="nav-link" data-i18n="nav_home">Ana Sayfa</a></li>
          <li><a href="/trending" class="nav-link active" data-i18n="nav_trending">Trendler</a></li>
          <li><a href="/top" class="nav-link" data-i18n="nav_top">En İyiler</a></li>
          <li><a href="/browse" class="nav-link" data-i18n="nav_browse">Keşfet</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <button class="search-trigger-btn" id="searchTriggerBtn" title="Hızlı Arama (Ctrl + K)">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <span data-i18n="nav_search">Anime Ara...</span>
          <span class="kbd-badge">Ctrl K</span>
        </button>

        <button class="btn-icon" id="navBookmarksBtn" title="Listem">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </button>

        <button class="btn-icon" id="navHistoryBtn" title="İzleme Geçmişi">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </button>

        <button class="btn-icon" id="langToggleBtn" title="Dil Seçimi / Change Language" style="width: auto; padding: 0 0.85rem; font-size: 0.8rem; font-family: var(--font-mono); gap: 0.35rem;">
          <span style="font-weight: 800;">TR</span> <span style="opacity: 0.4;">/ EN</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container" style="padding-top: calc(var(--nav-height) + 2rem); min-height: 80vh;">
    <div class="section-header" style="margin-bottom: 2rem;">
      <div>
        <span class="section-tag" data-i18n="shelf_trending_tag">Popüler</span>
        <h1 class="section-title" data-i18n="shelf_trending">Trend Animeler</h1>
      </div>
    </div>

    <!-- Catalog Grid -->
    <div class="anime-grid" id="trendingCatalogGrid">
      <div class="spinner" style="grid-column: 1/-1; margin: 4rem auto;"></div>
    </div>
  </main>

  <!-- Shared Modals & Drawers -->
  <div class="modal-overlay" id="detailsModalOverlay">
    <div class="details-modal" id="detailsModalContent"></div>
  </div>

  <div class="modal-overlay" id="searchModalOverlay">
    <div class="search-modal">
      <div class="search-input-header">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" class="search-input-box" id="searchInputBox" placeholder="Anime adı yazın..." autocomplete="off"/>
        <button class="btn-icon" id="closeSearchModalBtn">✕</button>
      </div>
      <div class="search-results-list" id="searchResultsList"></div>
    </div>
  </div>

  <div class="drawer" id="bookmarksDrawer">
    <div class="drawer-header">
      <h3 class="drawer-title" data-i18n="drawer_bookmarks_title">İzleme Listem</h3>
      <button class="btn-icon" id="closeBookmarksDrawerBtn">✕</button>
    </div>
    <div class="drawer-body" id="bookmarksDrawerBody"></div>
  </div>

  <div class="drawer" id="historyDrawer">
    <div class="drawer-header">
      <h3 class="drawer-title" data-i18n="drawer_history_title">İzleme Geçmişi</h3>
      <button class="btn-icon" id="closeHistoryDrawerBtn">✕</button>
    </div>
    <div class="drawer-body" id="historyDrawerBody"></div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© 2026 ANIMERIA. Reklamsız ve tamamen ücretsiz anime platformu.</span>
        <span style="display: flex; gap: 1.25rem; align-items: center;">
          <a href="https://fadimrak.xyz" target="_blank" style="color: var(--text-muted); text-decoration: underline;">İletişim: fadimrak.xyz</a>
          <a href="/dmca" style="color: var(--text-muted);">DMCA & Telif Hakkı</a>
        </span>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        const data = await window.API.getTrending(1, 24);
        window.UI.renderGrid("trendingCatalogGrid", data.media || []);
      } catch (e) {
        console.error(e);
      }
    });
  </script>
  <script src="js/topography.js"></script>
</body>
</html>
